[package]
name = "magpie-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "magpie"
path = "src/main.rs"

[dependencies]
magpie-core = { path = "../core" }
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "gzip", "brotli", "deflate", "rustls-tls"] }
