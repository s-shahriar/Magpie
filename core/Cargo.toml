[package]
name = "magpie-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Extraction engine for Magpie: resolves media URLs to downloadable renditions."

[lib]
crate-type = ["lib", "cdylib"]
name = "magpie_core"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "gzip", "brotli", "deflate", "rustls-tls", "cookies"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
base64 = "0.22"
percent-encoding = "2"
thiserror = "2"
once_cell = "1"
uniffi = { version = "0.29", features = ["cli"] }
